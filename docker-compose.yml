services:
  tenant-crimadezignz:
    image: originzero-tenant-crimadezignz:latest
    container_name: originzero-tenant-crimadezignz
    restart: unless-stopped
    ports:
      - "0.0.0.0:3105:3000"
    networks:
      - crimadezignz-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 40
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  crimadezignz-net:
    name: crimadezignz-net
    driver: bridge
